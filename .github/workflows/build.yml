name: APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      # İmza anahtarı repo sırlarından gelir (Settings > Secrets and variables > Actions):
      #   KISS_KEYSTORE_BASE64  -> base64 ile kodlanmış kiss.jks
      #   KISS_STORE_PASSWORD   -> anahtar parolası
      # Sırlar yoksa APK debug anahtarıyla imzalanır (yalnızca deneme için).
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KISS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kiss.jks"
            echo "KISS_KEYSTORE=$RUNNER_TEMP/kiss.jks" >> "$GITHUB_ENV"
          fi

      - name: Test ve APK
        env:
          KISS_STORE_PASSWORD: ${{ secrets.KISS_STORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: kiss-apk
          path: app/build/outputs/apk/release/app-release.apk
